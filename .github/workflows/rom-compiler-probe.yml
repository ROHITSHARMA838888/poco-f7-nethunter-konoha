name: Probe ROM symbol CRCs with LLVM 22
on:
  push:
    branches: [codex/rom-symbol-baseline]
    paths:
      - .github/workflows/rom-compiler-probe.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rom-compiler-probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install official LLVM 22 and BTF tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg build-essential flex bison libssl-dev libelf-dev bc dwarves python3
          curl -fsSLo /tmp/llvm-signing-key.asc https://apt.llvm.org/llvm-snapshot.gpg.key
          fingerprint=$(gpg --show-keys --with-colons /tmp/llvm-signing-key.asc | awk -F: '$1 == "fpr" {print $10; exit}')
          test "$fingerprint" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          gpg --dearmor < /tmp/llvm-signing-key.asc | sudo tee /usr/share/keyrings/llvm22.gpg > /dev/null
          echo 'deb [signed-by=/usr/share/keyrings/llvm22.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/llvm22.list
          sudo apt-get update
          sudo apt-get install -y clang-22 lld-22 llvm-22
      - name: Fetch exact ROM kernel source
        shell: bash
        run: |
          set -euo pipefail
          git init rom-kernel
          git -C rom-kernel remote add origin https://github.com/xiaomi-onyx-playground/android_kernel_xiaomi_sm8735.git
          git -C rom-kernel fetch --depth=1 origin 7750565ada3d57e195798519b005d2b038e888c1
          git -C rom-kernel checkout --detach FETCH_HEAD
          test "$(git -C rom-kernel rev-parse HEAD)" = 7750565ada3d57e195798519b005d2b038e888c1
      - name: Resolve and verify ROM config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rom-kernel/out probe-evidence
          gzip -dc compatibility/rom.config.gz > rom-kernel/out/.config
          cp rom-kernel/out/.config probe-evidence/rom-original.config
          clang-22 --version > probe-evidence/compiler.txt
          pahole --version > probe-evidence/pahole.txt
          git -C rom-kernel rev-parse HEAD > probe-evidence/source-commit.txt
          make -C rom-kernel O=out ARCH=arm64 LLVM=-22 olddefconfig 2>&1 | tee probe-evidence/configure.log
          cp rom-kernel/out/.config probe-evidence/resolved.config
          python3 rom-kernel/scripts/diffconfig probe-evidence/rom-original.config probe-evidence/resolved.config > probe-evidence/config-diff.txt
          for symbol in DEBUG_INFO_BTF DEBUG_INFO_BTF_MODULES KASAN_HW_TAGS ARM64_4K_PAGES MODULES MODVERSIONS CC_HAS_COUNTED_BY; do
            grep -qx "CONFIG_${symbol}=y" rom-kernel/out/.config || { echo "Required ROM setting lost: $symbol"; exit 1; }
          done
      - name: Compile representative symbol groups
        shell: bash
        env:
          ROM_PROBE_TOOLCHAIN_SCOPE: Official apt LLVM 22 diagnostic, not exact ROM Android Clang r596125
        run: |
          set -euo pipefail
          make -C rom-kernel -j"$(nproc)" O=out ARCH=arm64 LLVM=-22 kernel/module/version.o drivers/interconnect/core.o net/wireless/core.o net/wireless/util.o 2>&1 | tee probe-evidence/probe-build.log
          python3 compatibility/check_probe.py
          python3 compatibility/collect_partial_symbols.py
      - name: Retain symbol metadata and logs only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rom-llvm22-partial-symbol-evidence
          path: probe-evidence/
          if-no-files-found: error
