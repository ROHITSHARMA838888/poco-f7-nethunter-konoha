name: Validate Realtek drivers against ROM headers
on:
  push:
    branches: [codex/rom-symbol-baseline]
    paths:
      - .github/workflows/rom-driver-probe.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: rom-driver-probe
  cancel-in-progress: true
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ROM_PROBE_TOOLCHAIN_SCOPE: Official apt LLVM 22 root/adapter candidate, not exact ROM Android Clang r596125
    steps:
      - uses: actions/checkout@v4
      - name: Download already-built root candidate metadata
        uses: actions/download-artifact@v4
        with:
          name: rom-root-adapter-symbol-evidence
          run-id: 40852476542
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inherited-evidence
      - name: Install official LLVM 22 and matching BTF tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg build-essential flex bison libssl-dev libelf-dev bc dwarves python3
          curl -fsSLo /tmp/llvm-signing-key.asc https://apt.llvm.org/llvm-snapshot.gpg.key
          fingerprint=$(gpg --show-keys --with-colons /tmp/llvm-signing-key.asc | awk -F: '$1 == "fpr" {print $10; exit}')
          test "$fingerprint" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          gpg --dearmor < /tmp/llvm-signing-key.asc | sudo tee /usr/share/keyrings/llvm22.gpg > /dev/null
          echo 'deb [signed-by=/usr/share/keyrings/llvm22.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/llvm22.list
          sudo apt-get update
          sudo apt-get install -y clang-22 lld-22 llvm-22 kmod rsync
      - name: Fetch exact ROM kernel source
        shell: bash
        run: |
          set -euo pipefail
          git init rom-kernel
          git -C rom-kernel remote add origin https://github.com/xiaomi-onyx-playground/android_kernel_xiaomi_sm8735.git
          git -C rom-kernel fetch --depth=1 origin 7750565ada3d57e195798519b005d2b038e888c1
          git -C rom-kernel checkout --detach FETCH_HEAD
          test "$(git -C rom-kernel rev-parse HEAD)" = 7750565ada3d57e195798519b005d2b038e888c1
      - name: Integrate pinned KernelSU Next
        shell: bash
        run: |
          set -euo pipefail
          git init rom-kernel/.root_modules/KernelSU-Next
          git -C rom-kernel/.root_modules/KernelSU-Next remote add origin https://github.com/KernelSU-Next/KernelSU-Next.git
          git -C rom-kernel/.root_modules/KernelSU-Next fetch origin b427a3f9c2421a443f961007bfce66b25486643f
          git -C rom-kernel/.root_modules/KernelSU-Next checkout --detach FETCH_HEAD
          test "$(git -C rom-kernel/.root_modules/KernelSU-Next rev-parse HEAD)" = b427a3f9c2421a443f961007bfce66b25486643f
          ln -s ../.root_modules/KernelSU-Next/kernel rom-kernel/drivers/kernelsu
          python3 compatibility/wire_rom_root.py
          git -C rom-kernel diff --check
          git -C rom-kernel diff --exit-code -- kernel/module/
      - name: Preserve ROM config and verify ABI witness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rom-kernel/out probe-evidence
          cp inherited-evidence/resolved.config rom-kernel/out/.config
          cp rom-kernel/out/.config probe-evidence/rom-original.config
          clang-22 --version > probe-evidence/compiler.txt
          pahole --version > probe-evidence/pahole.txt
          git -C rom-kernel rev-parse HEAD > probe-evidence/source-commit.txt
          rom-kernel/scripts/config --file rom-kernel/out/.config -e KSU -e WLAN_VENDOR_ATH -m ATH9K_HTC -d RTL8XXXU
          make -C rom-kernel O=out ARCH=arm64 LLVM=-22 olddefconfig 2>&1 | tee probe-evidence/configure.log
          cp rom-kernel/out/.config probe-evidence/resolved.config
          python3 rom-kernel/scripts/diffconfig probe-evidence/rom-original.config probe-evidence/resolved.config > probe-evidence/config-diff.txt
          for symbol in DEBUG_INFO_BTF DEBUG_INFO_BTF_MODULES KASAN_HW_TAGS ARM64_4K_PAGES MODULES MODVERSIONS CC_HAS_COUNTED_BY KSU USB_CONFIGFS_F_HID HEADERS_INSTALL; do
            grep -qx "CONFIG_${symbol}=y" rom-kernel/out/.config || { echo "Required ROM ABI setting lost: $symbol"; exit 1; }
          done
          for symbol in CFG80211 MAC80211 ATH9K_HTC; do
            grep -qx "CONFIG_${symbol}=m" rom-kernel/out/.config || { echo "Required modular Wi-Fi setting lost: $symbol"; exit 1; }
          done
          if grep -Eq '^CONFIG_RTL8XXXU=[ym]$' rom-kernel/out/.config; then
            echo 'RTL8XXXU would conflict with external 8188eu'; exit 1
          fi
          git -C rom-kernel diff > probe-evidence/root-integration.patch
          git -C rom-kernel/.root_modules/KernelSU-Next rev-parse HEAD > probe-evidence/ksu-source-commit.txt
          make -C rom-kernel -j"$(nproc)" O=out ARCH=arm64 LLVM=-22 kernel/module/version.o 2>&1 | tee probe-evidence/probe-build.log
          cp rom-kernel/out/kernel/module/.version.o.cmd probe-evidence/version.o.cmd.txt
          python3 compatibility/check_probe.py
      - name: Build both drivers with normal FORTIFY and Werror
        shell: bash
        run: |
          set -euo pipefail
          make -C rom-kernel -j"$(nproc)" O=out ARCH=arm64 LLVM=-22 modules_prepare 2>&1 | tee probe-evidence/headers-prepare.log
          cp inherited-evidence/Module.symvers rom-kernel/out/Module.symvers
          cp inherited-evidence/Module.symvers probe-evidence/Module.symvers
          if ! bash compatibility/build_rom_drivers.sh; then
            if [ -d external/rtl8812au/core ]; then
              make -C rom-kernel -j"$(nproc)" O=out ARCH=arm64 LLVM=-22 M="$GITHUB_WORKSPACE/external/rtl8812au" CONFIG_88XXAU=m CONFIG_RTL8188EU=m CONFIG_PLATFORM_I386_PC=n USER_EXTRA_CFLAGS="-DCONFIG_LITTLE_ENDIAN -DCONFIG_IOCTL_CFG80211 -DRTW_USE_CFG80211_STA_EVENT" KCFLAGS="-Wno-error=attribute-warning" core/rtw_recv.o 2>&1 | tee probe-evidence/failure-diagnostic-compile.log || true
              python3 compatibility/trace_fortify.py 2>&1 | tee probe-evidence/failure-ir-trace.log || true
              rm -f probe-evidence/rtw_recv.ll
            fi
            exit 1
          fi
      - name: Retain strict driver validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rom-strict-driver-validation-evidence
          path: |
            probe-evidence/*.log
            probe-evidence/*.txt
            probe-evidence/*.json
            probe-evidence/*.config
            probe-evidence/*symvers
            probe-evidence/*.patch
          if-no-files-found: error
      - name: Retain individually verified diagnostic modules
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rom-strict-driver-probe-modules
          path: verified-driver-files/
          if-no-files-found: ignore
