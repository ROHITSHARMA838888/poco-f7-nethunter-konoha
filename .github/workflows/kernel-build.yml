name: Compile Onyx baseline kernel
on:
  push:
    paths:
      - .github/workflows/kernel-build.yml
      - scripts/**
  workflow_run:
    workflows: [Validate Onyx kernel configuration]
    types: [completed]
  workflow_dispatch:
concurrency:
  group: onyx-kernel-build-${{ github.repository }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  compile:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential flex bison libssl-dev libelf-dev bc clang lld llvm dwarves python3 rsync
      - name: Retrieve pinned source
        shell: bash
        run: |
          set -euo pipefail
          source source.lock
          git init kernel
          git -C kernel remote add origin "$KERNEL_REPOSITORY"
          git -C kernel fetch --depth=1 origin "$KERNEL_COMMIT"
          git -C kernel checkout --detach FETCH_HEAD
          test "$(git -C kernel rev-parse HEAD)" = "$KERNEL_COMMIT"
      - name: Configure and compile baseline
        shell: bash
        run: |
          set -euo pipefail
          export ARCH=arm64
          mkdir -p diagnostics
          clang --version > diagnostics/compiler.txt
          python3 scripts/prepare-source.py
          cd kernel
          git diff > ../diagnostics/source-fixes.patch
          git rev-parse HEAD > ../diagnostics/kernel-commit.txt
          # Integrate a pinned KernelSU Next revision, matching upstream layout.
          git init .root_modules/KernelSU-Next
          git -C .root_modules/KernelSU-Next remote add origin https://github.com/KernelSU-Next/KernelSU-Next.git
          git -C .root_modules/KernelSU-Next fetch --depth=1 origin b427a3f9c2421a443f961007bfce66b25486643f
          git -C .root_modules/KernelSU-Next checkout --detach FETCH_HEAD
          test -f .root_modules/KernelSU-Next/kernel/Kconfig
          ln -s ../.root_modules/KernelSU-Next/kernel drivers/kernelsu
          make O=out LLVM=1 konoha_defconfig
          scripts/kconfig/merge_config.sh -m -O out out/.config ../config/nethunter.fragment
          scripts/config --file out/.config -e KSU -d KSU_SUSFS -d KPM
          make O=out LLVM=1 olddefconfig
          grep -qx 'CONFIG_KSU=y' out/.config
          cp out/.config ../diagnostics/resolved.config
          for symbol in USB_CONFIGFS_F_HID CFG80211 MAC80211 ATH9K_HTC RTL8XXXU; do
            grep -qx "CONFIG_${symbol}=y" out/.config || exit 1
          done
          make -j"$(nproc)" O=out LLVM=1 KCFLAGS="-Wno-error=unused-function -Wno-error=unused-variable" kernel/module/main.o lib/lz4/lz4hc.o net/ipv6/exthdrs.o net/ipv6/ioam6.o 2>&1 | tee ../diagnostics/preflight.log
          make -j"$(nproc)" O=out LLVM=1 KCFLAGS="-Wno-error=unused-function -Wno-error=unused-variable" Image modules 2>&1 | tee ../diagnostics/build.log
          cp out/Module.symvers ../diagnostics/
          cp out/System.map ../diagnostics/
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onyx-baseline-diagnostics
          path: diagnostics/
          if-no-files-found: warn
      - name: Upload experimental kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: onyx-baseline-image-unvalidated
          path: kernel/out/arch/arm64/boot/Image
          if-no-files-found: error
      - name: Compile pinned external Realtek drivers
        shell: bash
        run: |
          set -euo pipefail
          source drivers.lock
          mkdir -p external wireless-modules
          failed=0
          for driver in rtl8812au rtl8188eus; do
            if [ "$driver" = rtl8812au ]; then
              remote="$RTL8812AU_REPOSITORY"; revision="$RTL8812AU_COMMIT"
            else
              remote="$RTL8188EUS_REPOSITORY"; revision="$RTL8188EUS_COMMIT"
            fi
            git init "external/$driver"
            git -C "external/$driver" remote add origin "$remote"
            git -C "external/$driver" fetch --depth=1 origin "$revision"
            git -C "external/$driver" checkout --detach FETCH_HEAD
            test "$(git -C "external/$driver" rev-parse HEAD)" = "$revision"
            if make -j"$(nproc)" -C kernel O=out ARCH=arm64 LLVM=1 M="$GITHUB_WORKSPACE/external/$driver" CONFIG_PLATFORM_I386_PC=n USER_EXTRA_CFLAGS="-DCONFIG_LITTLE_ENDIAN -DCONFIG_IOCTL_CFG80211 -DRTW_USE_CFG80211_STA_EVENT" modules 2>&1 | tee "diagnostics/$driver.log"; then
              find "external/$driver" -name '*.ko' -exec cp -t wireless-modules/ {} +
            else
              failed=1
            fi
          done
          exit "$failed"
      - name: Upload external driver diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onyx-external-wifi-diagnostics
          path: |
            diagnostics/rtl*.log
            wireless-modules/*.ko
          if-no-files-found: warn
